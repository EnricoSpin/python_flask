<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Meu Flask App{% endblock %}</title> <!--Jinjo permite que os templates sobrescrevam com seu conteúdo-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark"> 
        <div class="container">
            <a class="navbar-brand" href="{{url_for('home')}}">Meu app</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{{url_for('home')}}">Home</a>
                <a class="nav-link" href="{{url_for('about')}}">Sobre</a>
                <a class="nav-link" href="{{url_for('services')}}">Serviços</a>
                <a class="nav-link" href="{{url_for('contact')}}">Contato</a>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        {% block content %}{% endblock %} 
        <!--Jinjo permite que os templates sobrescrevam com seu conteúdo-->
    </main>
</body>
</html>
