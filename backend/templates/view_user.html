{% extends "base.html" %} {% block content %}
<h1>Lista de Usuários</h1>
<a href="{{ url_for('add_user') }}" class="btn btn-primary"
  >Adicionar Novo Usuário</a>
<table class="table table-bordered mt-2">
  <tr>
    <th>ID</th>
    <th>Nome</th>
    <th>Email</th>
    <th>Telefone</th>
    <th>Ações</th>
  </tr>
  {% for user in users %}
  <tr>
    <td>{{ user[0] }}</td>
    <td>{{ user[1] }}</td>
    <td>{{ user[2] }}</td>
    <td>{{ user[3] }}</td>
    <td>
      <a href="{{ url_for('edit_user', id=user[0]) }}" class="btn btn-secondary"
        >Editar</a
      >
      <a href="{{ url_for('delete_user', id=user[0]) }}" class="btn btn-danger"
        >Deletar</a
      >
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
