{% extends "base.html" %} {% block content %}
<div class="col-sm-12 mb-4"><h3 class="text-primary">Editar usuário</h3></div>
<div class="col-sm-12">
  <div class="card shadow">
    <form method="post">
      <div class="form-group">
        <label for="name" class="col-sm-2 col-form-label">Nome</label>
        <div class="col-sm-12">
          <input type="text" name="name" value="{{ user[1] }}" required id="name" class="form-control" />
        </div>
      </div>
      <div class="form-group">
        <label for="email" class="col-sm-2 col-form-label">Nome</label>
        <div class="col-sm-12">
          <input type="email" name="email" value="{{ user[2] }}" required id="email" class="form-control" />
        </div>
      </div>
      <div class="form-group">
        <label for="phone" class="col-sm-2 col-form-label">Telefone</label>
        <div class="col-sm-12">
          <input type="text" name="phone" value="{{ user[3] }}" id="phone" class="form-control" />
        </div>
      </div>
      <div class="form-group ">
        <div class="col-sm-12">
          <input type="submit" value="Editar" class="btn btn-success" />
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
